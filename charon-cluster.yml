---

- name: A playbook that creates a charon cluster
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Check if Docker is installed
      command: docker --version
      register: docker_valid
      ignore_errors: true
      changed_when: docker_valid != 0
      when: deployment_mode | default('docker') == 'docker'
      tags:
        - always

  roles:
    - role: docker_install
      when: deployment_mode | default('docker') == 'docker'
      tags:
        - docker
        - setup
    - role: docker_network
      when: deployment_mode | default('docker') == 'docker'
      tags:
        - docker
        - network
        - setup
    - role: mev_boost
      when: deploy_mev_boost | default(false) | bool
      tags:
        - mev-boost
        - mev
    - role: beacon_node
      when: deploy_beacon_node | default(false) | bool
      tags:
        - beacon
        - beacon-node
        - execution
        - consensus
    - role: charon_cluster
      tags:
        - charon
        - charon-cluster
    - role: prometheus
      when: deploy_prometheus | default(false) | bool
      tags:
        - prometheus
        - monitoring
    - role: alloy
      when: deploy_alloy | default(false) | bool
      tags:
        - alloy
        - logging
        - monitoring
