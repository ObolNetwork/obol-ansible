---
# =============================================================================
# Common setup
# =============================================================================

- name: Create obol system group
  ansible.builtin.group:
    name: "{{ baremetal_group }}"
    system: true
  tags:
    - beacon
    - beacon-node
    - setup

- name: Create obol system user
  ansible.builtin.user:
    name: "{{ baremetal_user }}"
    group: "{{ baremetal_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags:
    - beacon
    - beacon-node
    - setup

- name: Create beacon directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ baremetal_user }}"
    group: "{{ baremetal_group }}"
  loop:
    - "{{ baremetal_data_dir }}"
    - "{{ baremetal_data_dir }}/{{ execution_client }}"
    - "{{ baremetal_data_dir }}/{{ consensus_client }}"
    - "{{ beacon_jwt_dir }}"
  tags:
    - beacon
    - beacon-node
    - setup

- name: Check JWT secret
  ansible.builtin.stat:
    path: "{{ beacon_jwt_file }}"
  register: beacon_jwt_stat
  tags:
    - beacon
    - beacon-node
    - jwt

- name: Generate JWT secret
  ansible.builtin.shell: "openssl rand -hex 32 > {{ beacon_jwt_file }}"
  when: not beacon_jwt_stat.stat.exists
  changed_when: true
  tags:
    - beacon
    - beacon-node
    - jwt

- name: Ensure JWT secret permissions
  ansible.builtin.file:
    path: "{{ beacon_jwt_file }}"
    mode: '0644'
    owner: "{{ baremetal_user }}"
    group: "{{ baremetal_group }}"
  tags:
    - beacon
    - beacon-node
    - jwt

- name: Resolve execution engine port
  ansible.builtin.set_fact:
    execution_engine_port: >-
      {{ geth_engine_port if execution_client == 'geth'
        else besu_engine_port if execution_client == 'besu'
        else reth_engine_port if execution_client == 'reth'
        else nethermind_engine_port }}
  tags:
    - beacon
    - beacon-node
    - execution
    - configuration

- name: Default builder endpoint to mev-boost when enabled
  ansible.builtin.set_fact:
    builder_endpoint: "http://127.0.0.1:{{ mevboost_port }}"
  when:
    - deploy_mev_boost | default(false)
    - builder_endpoint | default('') == ''
  tags:
    - beacon
    - beacon-node
    - configuration

# =============================================================================
# Runtime dependencies
# =============================================================================

- name: Install Node.js (for Lodestar)
  when: consensus_client == 'lodestar'
  tags:
    - beacon
    - beacon-node
    - consensus
    - lodestar
    - dependencies
  block:
    - name: Add NodeSource repository
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      changed_when: true

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

- name: Install Java 21 (for Teku/Besu)
  when: execution_client in ['besu'] or consensus_client in ['teku']
  tags:
    - beacon
    - beacon-node
    - dependencies
  block:
    - name: Install OpenJDK 21
      ansible.builtin.apt:
        name: openjdk-21-jre-headless
        state: present
        update_cache: true

# =============================================================================
# Execution layer clients
# =============================================================================

# -- Geth --
- name: Deploy Geth execution client
  when: execution_client == 'geth'
  tags:
    - beacon
    - beacon-node
    - execution
    - geth
    - deploy
  block:
    - name: Get Geth release info
      ansible.builtin.uri:
        url: "https://api.github.com/repos/ethereum/go-ethereum/releases/tags/{{ geth_version }}"
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: geth_release

    - name: Find Geth linux-amd64 asset
      ansible.builtin.set_fact:
        geth_download_url: "{{ geth_release.json.assets | selectattr('name', 'match', 'geth-linux-amd64.*\\.tar\\.gz$') | map(attribute='browser_download_url') | first }}"
        geth_archive_name: "{{ geth_release.json.assets | selectattr('name', 'match', 'geth-linux-amd64.*\\.tar\\.gz$') | map(attribute='name') | first | regex_replace('\\.tar\\.gz$', '') }}"

    - name: Download and extract Geth
      ansible.builtin.unarchive:
        src: "{{ geth_download_url }}"
        dest: /tmp/
        remote_src: true

    - name: Install Geth binary
      ansible.builtin.copy:
        src: "/tmp/{{ geth_archive_name }}/geth"
        dest: "{{ baremetal_bin_dir }}/geth"
        mode: '0755'
        owner: root
        group: root
        remote_src: true
      notify: restart geth

    - name: Deploy Geth systemd service
      ansible.builtin.template:
        src: geth.service.j2
        dest: /etc/systemd/system/geth.service
        mode: '0644'
      notify: restart geth

    - name: Enable and start Geth
      ansible.builtin.systemd:
        name: geth
        state: started
        enabled: true
        daemon_reload: true

# -- Nethermind --
- name: Deploy Nethermind execution client
  when: execution_client == 'nethermind'
  tags:
    - beacon
    - beacon-node
    - execution
    - nethermind
    - deploy
  block:
    - name: Download Nethermind
      ansible.builtin.get_url:
        url: "https://github.com/NethermindEth/nethermind/releases/download/{{ nethermind_version }}/nethermind-{{ nethermind_version }}-linux-x64.zip"
        dest: /tmp/nethermind.zip
        mode: '0644'

    - name: Create Nethermind directory
      ansible.builtin.file:
        path: "{{ baremetal_data_dir }}/nethermind-bin"
        state: directory
        mode: '0755'
        owner: "{{ baremetal_user }}"
        group: "{{ baremetal_group }}"

    - name: Extract Nethermind
      ansible.builtin.unarchive:
        src: /tmp/nethermind.zip
        dest: "{{ baremetal_data_dir }}/nethermind-bin"
        remote_src: true
      notify: restart nethermind

    - name: Deploy Nethermind systemd service
      ansible.builtin.template:
        src: nethermind.service.j2
        dest: /etc/systemd/system/nethermind.service
        mode: '0644'
      notify: restart nethermind

    - name: Enable and start Nethermind
      ansible.builtin.systemd:
        name: nethermind
        state: started
        enabled: true
        daemon_reload: true

