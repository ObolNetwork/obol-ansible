# -- Nimbus --
- name: Deploy Nimbus consensus client
  when: consensus_client == 'nimbus'
  tags:
    - beacon
    - beacon-node
    - consensus
    - nimbus
    - deploy
  block:
    - name: Download Nimbus
      ansible.builtin.get_url:
        url: "https://github.com/status-im/nimbus-eth2/releases/download/{{ nimbus_version }}/nimbus-eth2_Linux_amd64_{{ nimbus_version | regex_replace('^multiarch-', '') }}.tar.gz"
        dest: /tmp/nimbus.tar.gz
        mode: '0644'

    - name: Create Nimbus extract directory
      ansible.builtin.file:
        path: /tmp/nimbus-extract
        state: directory
        mode: '0755'

    - name: Extract Nimbus
      ansible.builtin.unarchive:
        src: /tmp/nimbus.tar.gz
        dest: /tmp/nimbus-extract
        remote_src: true

    - name: Install Nimbus beacon node binary
      ansible.builtin.copy:
        src: "/tmp/nimbus-extract/build/nimbus_beacon_node"
        dest: "{{ baremetal_bin_dir }}/nimbus_beacon_node"
        mode: '0755'
        owner: root
        group: root
        remote_src: true
      notify: restart nimbus

    - name: Deploy Nimbus systemd service
      ansible.builtin.template:
        src: nimbus-beacon.service.j2
        dest: /etc/systemd/system/nimbus-beacon.service
        mode: '0644'
      notify: restart nimbus

    - name: Enable and start Nimbus
      ansible.builtin.systemd:
        name: nimbus-beacon
        state: started
        enabled: true
        daemon_reload: true

